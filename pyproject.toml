[project]
name = "ironforgedcore"
version = "0.2.1"
description = "Shared database, models, services, and business logic for IronForgedBot and its API"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]",
    "aiomysql",
    "alembic",
    "pydantic",
    "aiohttp",
    "python-dotenv",
    "aiofiles",
    "python-dateutil",
    "concurrent-log-handler",
    "wom.py",
    "strenum",
]

[project.optional-dependencies]
dev = [
    "aiosqlite",
    "starlette",
    "fastapi",
    "build",
    "twine",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "ironforgedcore",
    "ironforgedcore.alembic",
    "ironforgedcore.alembic.versions",
    "ironforgedcore.cache",
    "ironforgedcore.common",
    "ironforgedcore.exceptions",
    "ironforgedcore.models",
    "ironforgedcore.services",
    "ironforgedcore.storage",
]

[tool.setuptools.package-data]
"ironforgedcore" = ["alembic.ini"]
"ironforgedcore.alembic" = ["*.mako"]
"ironforgedcore.alembic.versions" = ["*.py"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", "*.pyo"]
